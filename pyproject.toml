[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-kinematics"
version = "0.1.0"
description = "Gait-language self-supervised learning for knee 6-DOF kinematics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "torch",
]

[tool.setuptools.packages.find]
include = ["knee_kinematics*"]
